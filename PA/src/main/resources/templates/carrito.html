<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moda Elite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <div class="wrapper">
        <header class="header-mobile">
            <h1 class="logo">Moda Elite</h1>
            <button class="open-menu" id="open-menu">
                <i class="bi bi-list"></i>
            </button>
        </header>
        <aside>
            <button class="close-menu" id="close-menu">
                <i class="bi bi-x"></i>
            </button>
            <header>
                <h1 class="logo">Moda Elite</h1>
            </header>
            <nav>
                <ul>
                    <li>
                        <a class="boton-menu boton-volver" href="/home">
                            <i class="bi bi-arrow-return-left"></i> Seguir comprando
                        </a>
                    </li>
                    <li>
                        <a class="boton-menu boton-carrito active" href="/carrito">
                            <i class="bi bi-cart-fill"></i> Carrito
                        </a>
                    </li>
                </ul>
            </nav>
            <footer>
                <p class="texto-footer">Moda Elite @</p>
            </footer>
        </aside>
        <main>
            <h2 class="titulo-principal">Carrito</h2>
            <div class="contenedor-carrito">
                <p id="carrito-vacio" class="carrito-vacio">Tu carrito está vacío. <i class="bi bi-emoji-frown"></i></p>

                <div id="carrito-productos" class="carrito-productos disabled">
                    <!-- Esto se va a completar con el JS -->
                </div>

                <div id="carrito-acciones" class="carrito-acciones disabled">
                    <div class="carrito-acciones-izquierda">
                        <button id="carrito-acciones-vaciar" class="carrito-acciones-vaciar">Vaciar carrito</button>
                    </div>
                    <div class="carrito-acciones-derecha">
                        <div class="carrito-acciones-total">
                            <p>Total:</p>
                            <p id="total">$3000</p>
                        </div>
                        <button id="carrito-acciones-comprar" class="carrito-acciones-comprar">Comprar ahora</button>
                    </div>
                </div>

                <!-- Pasarela de pago (inicialmente oculta) -->
                <div id="pasarela-pago" class="pasarela-pago disabled">
                    <h3>Completa tu pago</h3>
                    <div class="formulario-pago">
                        <div class="grupo-formulario">
                            <label for="nombre-tarjeta">Nombre en la tarjeta</label>
                            <input type="text" id="nombre-tarjeta" placeholder="Juan Pérez">
                        </div>
                        <div class="grupo-formulario">
                            <label for="numero-tarjeta">Número de tarjeta</label>
                            <input type="text" id="numero-tarjeta" placeholder="1234 5678 9012 3456">
                        </div>
                        <div class="grupo-formulario-doble">
                            <div class="grupo-formulario">
                                <label for="fecha-exp">Fecha de expiración</label>
                                <input type="text" id="fecha-exp" placeholder="MM/AA">
                            </div>
                            <div class="grupo-formulario">
                                <label for="cvv">CVV</label>
                                <input type="password" id="cvv" placeholder="123">
                            </div>
                        </div>
                        <div class="grupo-formulario">
                            <button id="btn-procesar-pago" class="carrito-acciones-comprar">Procesar Pago</button>
                        </div>
                    </div>
                </div>

                <div id="metodo-pago" class="metodo-pago">
                    <h3>Escoge tu método de pago</h3>
                    <div class="metodo-pago-opciones">
                        <label>
                            <input type="radio" name="metodo-pago" value="tarjeta" checked>
                            <i class="bi bi-credit-card"></i> Tarjeta de Crédito/Débito
                        </label>
                        <label>
                            <input type="radio" name="metodo-pago" value="paypal">
                            <i class="bi bi-paypal"></i> PayPal
                        </label>
                        <label>
                            <input type="radio" name="metodo-pago" value="transferencia">
                            <i class="bi bi-bank"></i> Transferencia Bancaria
                        </label>
                    </div>
                </div>

                <p id="carrito-comprado" class="carrito-comprado disabled">Muchas gracias por tu compra. <i class="bi bi-emoji-laughing"></i></p>

            </div>
        </main>
    </div>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/carrito.js"></script>
    <script src="/js/menu.js"></script>
</body>
</html>
